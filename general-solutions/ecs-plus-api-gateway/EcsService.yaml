AWSTemplateFormatVersion: 2010-09-09

Description: This template configures a ECS Cluster, ECS Service, Task Definition and ALB and related resources

Parameters:
  DockerImage:
    Type: String
    Description: Public docker image
    Default: nginxdemos/hello # See the image at https://hub.docker.com/r/nginxdemos/hello/
    # For DockerHub repository it can be [provider/image]
    # For Other respository, format must be [repository-url/image:tag] or [repository-url/image@digest]
  ContainerName:
    Type: String
    Description: Name for the container
    Default: NginxDemoHello

Resources:
  SimpleCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: SimpleCluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EcsTaskExecRole
      Description: Role for ECS Service Task management
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ecs-tasks.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EcsTaskRole
      Description: Role for ECS container application
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service: ecs-tasks.amazonaws.com
      Policies:
        - PolicyName: EcsTaskPolicy
          PolicyDocument:
            Version: 2012-10-17
            Id: AllowS3ListRead
            Statement:
              - Sid: AllowObjectRead
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "*"              

  ContainerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/containers/${ContainerName}
      RetentionInDays: 14

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: DevAppFamily
      Cpu: 256 # 0.25 vCPU
      Memory: 512 # 1024 = 1GB RAM
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: !Ref ContainerName
          Image: !Ref DockerImage
          Cpu: 256
          Memory: 512
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ContainerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nginx-container

  EcsTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group
      VpcId: !ImportValue Network-VpcId

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal ALB security group
      VpcId: !ImportValue Network-VpcId
      SecurityGroupEgress:
        - Description: Allow outbound access from ALB to ECS tasks
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          DestinationSecurityGroupId: !GetAtt EcsTaskSecurityGroup.GroupId
                   

  EcsTaskSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Accept ECS task traffic only from the ALB.
      GroupId: !GetAtt EcsTaskSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: NginxServerBalancer
      Type: application
      Scheme: internal
      IpAddressType: ipv4
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId
      Subnets:
        - !ImportValue Network-PrivateSubnetId1
        - !ImportValue Network-PrivateSubnetId2

  EcsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue Network-VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /
      HealthCheckProtocol: HTTP

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref EcsTargetGroup

  EcsService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      Cluster: !Ref SimpleCluster
      ServiceName: NginxHelloServer
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDef
      SchedulingStrategy: REPLICA
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      LoadBalancers:
        - TargetGroupArn: !Ref EcsTargetGroup
          ContainerName: !Ref ContainerName
          ContainerPort: 80
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !GetAtt EcsTaskSecurityGroup.GroupId
          Subnets:
            - !ImportValue Network-PrivateSubnetId1
            - !ImportValue Network-PrivateSubnetId2

Outputs:
  DnsName:
    Description: DNS name for the Application Load Balancer
    Value: !GetAtt InternalAlb.DNSName
  EcsServiceName:
    Value: !GetAtt EcsService.Name
  AlbSecurityGroupId:
    Description: Security group ID for the Application Load Balancer
    Value: !GetAtt AlbSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-AlbSecurityGroupId
  AlbListenerArn:
    Description: ARN for the Application Load Balancer listener
    Value: !Ref AlbListener
    Export:
      Name: !Sub ${AWS::StackName}-AlbListenerArn
